        # --- Tony & Kate wedding site (Flask on :5005) ---
        location /wedding/ {
                proxy_pass http://127.0.0.1:5005/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
        }

        location /wedding/static/ {
                proxy_pass http://127.0.0.1:5005/static/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
        }
